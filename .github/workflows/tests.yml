name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GPyT (GPL-3.0) at the validated commit
        run: |
          git clone https://github.com/jabeim/AB-Generic-Python-Toolbox.git ../AB-Generic-Python-Toolbox
          git -C ../AB-Generic-Python-Toolbox checkout 56b980eed8babeb54aca1358b5d5c9df1e4bec2f
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run tests (no audio hardware needed)
        run: python -m pytest -q
